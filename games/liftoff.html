<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftoff · AFTERGLOW social casino</title>
<meta name="description" content="Ride the rocket and cash out before it crashes. A free-to-play crash game on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.sky{position:relative;flex:1;min-height:clamp(260px,38vh,420px);overflow:hidden;touch-action:manipulation}
@media(min-width:900px){.sky{min-height:500px}}
/* phones: the big LAUNCH / CASH OUT button sits right under the graph so both are on screen */
@media(max-width:899px){.game .panel{display:flex;flex-direction:column}.game .panel>.ghead{order:-2}#go{order:-1;margin-bottom:14px}.game .stage{min-height:0}}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.readout{position:absolute;left:0;right:0;top:30%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:0 12px}
.readout .mx{font:900 clamp(52px,15vw,120px)/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--l);text-shadow:0 0 24px currentColor,0 0 4px currentColor;letter-spacing:-.02em;transition:color .2s}
.readout .mx.idle{color:var(--faint);text-shadow:none;opacity:.7}
.readout .mx.dead{color:var(--r)}
.readout .mx.cd{color:var(--c);animation:pop .35s}
.readout .sub{margin-top:10px;font:800 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:20px}
.readout .sub.bad{color:var(--r);text-shadow:0 0 12px #ff4d6d99;font-size:clamp(15px,4vw,20px)}
.readout .sub.good{color:var(--l);text-shadow:var(--glowl)}
.sky.shake{animation:shake .45s}
#go{font-variant-numeric:tabular-nums}
#go.cash{font-size:18px}
.autorow{display:flex;gap:8px;align-items:stretch}
.autorow .inp{flex:1}
.autorow .inp .sx{padding-right:12px;color:var(--faint);font:800 15px var(--mono)}
.auto-chips button{min-height:44px}
.alaunch{display:flex;gap:8px;margin-top:8px}
.alaunch .seg{flex:1}
.alaunch .seg button{min-height:40px;font-family:var(--mono)}
.alaunch .btn{min-height:46px;min-width:112px}
.sess{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad2);padding:6px 12px}
.sess h3{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:6px 0 2px}
#net.pos{color:var(--l)}#net.neg{color:var(--r)}
.kbd{display:none;margin-top:10px;font-size:12px;color:var(--faint);text-align:center}
.kbd kbd{font:700 11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--dim)}
@media(hover:hover) and (pointer:fine){.kbd{display:block}}
.recent span{min-width:52px;text-align:center}
/* core topbar is ~8px too wide at 390px with the wordmark visible; tighten on this page */
@media(max-width:419px){.topbar{gap:6px;padding:0 8px}}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div id="bet"></div>
    <div class="field"><label for="auto">Auto cash-out <span class="faint" id="autohint">off</span></label>
      <div class="inp"><input id="auto" inputmode="decimal" placeholder="e.g. 2.00" autocomplete="off" aria-label="Auto cash-out multiplier"><span class="sx">×</span><button type="button" id="autoclr" aria-label="Turn auto cash-out off">Off</button></div>
      <div class="chips auto-chips" id="autochips"><button type="button" data-a="1.5">1.5×</button><button type="button" data-a="2">2×</button><button type="button" data-a="5">5×</button><button type="button" data-a="10">10×</button></div>
    </div>
    <button class="btn big pri" id="go">LAUNCH</button>
    <div class="field" style="margin:12px 0 0"><label>Auto-launch <span class="faint">needs auto cash-out</span></label>
      <div class="alaunch"><div class="seg" id="rseg"><button data-n="10" class="on">10</button><button data-n="25">25</button><button data-n="50">50</button><button data-n="0" aria-label="Unlimited">∞</button></div>
      <button class="btn" id="autobtn">Start</button></div>
    </div>
    <div class="sess" aria-live="polite">
      <h3>This session</h3>
      <div class="stat-row"><span>Rounds</span><b id="srounds">0</b></div>
      <div class="stat-row"><span>Best cash-out</span><b id="sbest">-</b></div>
      <div class="stat-row"><span>Net</span><b id="net">0</b></div>
    </div>
    <div class="kbd"><kbd>Space</kbd> launch / cash out</div>
  </section>
  <section class="stage">
    <div class="recent" id="recent" aria-label="Recent crash points"></div>
    <div class="sky" id="sky">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="readout" aria-live="off"><div class="mx idle mono" id="mx">1.00×</div><div class="sub" id="sub">Set your bet and launch</div></div>
    </div>
  </section>
</main>
<script type="module" src="/games/liftoff.js"></script>
</body></html>
