<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyperdrive Hi-Lo · AFTERGLOW social casino</title>
<meta name="description" content="Higher or lower? Chain correct calls to punch the hyperdrive and stack your multiplier. A free-to-play Hi-Lo game on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.hl-stage{--tint:#22f0ff;--cw:clamp(104px,29vw,150px);gap:0}
#warp{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hl-stage>*:not(#warp){position:relative;z-index:1}
.hl-stage .recent{background:#05050a99;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hl-flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,var(--fc,#b8ff3b55),transparent 65%)}
.hl-flash.go{animation:hlflash .6s ease-out}
@keyframes hlflash{0%{opacity:1}100%{opacity:0}}

.hl-hud{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px 14px 4px}
.hl-mult{text-align:center;flex:1;min-width:0}
.hl-mult small,.hl-side small{display:block;color:var(--faint);font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.hl-mult b{display:block;font:900 clamp(34px,10vw,56px)/1.05 var(--mono);font-variant-numeric:tabular-nums;color:var(--tint);text-shadow:0 0 18px var(--tint),0 0 2px var(--tint);transition:color .4s,text-shadow .4s}
.hl-mult b.bump{animation:bump .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.18)}}
.hl-mult .pay{font:800 15px var(--mono);color:var(--l);text-shadow:var(--glowl)}
.hl-mult .pay span{color:var(--faint);font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-right:6px;text-shadow:none}
.hl-side{min-width:64px;text-align:center;background:#0e0e1ccc;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.hl-side b{font:800 18px var(--mono);display:block}
.hl-side.chain b{color:var(--tint)}
.hl-side .pips{display:flex;gap:3px;justify-content:center;margin-top:3px}
.hl-side .pips i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.hl-side .pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}

.hl-trail{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;height:84px;padding:8px 14px 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
.hl-trail .tc{--cw:40px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;animation:tcin .35s cubic-bezier(.2,1.4,.4,1)}
.hl-trail .tc .call{font:800 10px var(--mono);padding:1px 6px;border-radius:999px;background:var(--panel2);color:var(--dim);white-space:nowrap}
.hl-trail .tc.ok .call{background:var(--l);color:#122000}
.hl-trail .tc.bad .call{background:var(--r);color:#fff}
.hl-trail .tc.skip{opacity:.55}
@keyframes tcin{from{transform:translateX(30px) scale(.6);opacity:0}}

.hl-table{flex:1;display:grid;place-items:center;min-height:calc(var(--cw)*1.4 + 28px);padding:10px 0;perspective:900px}
.hl-slot{position:relative;width:var(--cw);aspect-ratio:5/7}
.hl-slot .ring{position:absolute;inset:-10px;border-radius:calc(var(--cw)*.16);border:2px solid var(--tint);opacity:.55;box-shadow:0 0 22px var(--tint),inset 0 0 18px var(--tint);transition:border-color .4s,box-shadow .4s}
.hl-slot.lost .ring{border-color:var(--r);box-shadow:0 0 30px var(--r),inset 0 0 18px var(--r);opacity:.9}
.hl-slot.won .ring{border-color:var(--l);box-shadow:0 0 30px var(--l),inset 0 0 18px var(--l);opacity:.9}
.hl-slot .pcard{position:absolute;inset:0}
.pcard{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.11);background:linear-gradient(160deg,#fff 0%,#f1f2fb 70%,#e2e4f4);color:#14142a;box-shadow:0 8px 22px #000b,0 0 0 1px #0002;position:relative;overflow:hidden;font-family:var(--sans);flex:none}
.pcard.red{color:#e81ea8}
.pcard .cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-weight:900;font-size:calc(var(--cw)*.24)}
.pcard .cn i{font-style:normal;font-size:.8em;margin-top:1px}
.pcard .tl{top:6%;left:7%}.pcard .br{bottom:6%;right:7%;transform:rotate(180deg)}
.pcard .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5);line-height:1}
.pcard.red .pip{text-shadow:0 0 10px #ff3dc866}
.pcard .face{position:absolute;inset:24% 22%;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;font:900 calc(var(--cw)*.36)/1 var(--sans);background:linear-gradient(160deg,#8b5cff22,#22f0ff22)}
.pcard.red .face{background:linear-gradient(160deg,#ff3dc822,#ffd84d22)}
.pcard .face small{display:block;font-size:.45em;text-align:center;margin-top:2px}
.pcard.mini .cn.br,.pcard.mini .face,.pcard.mini .pip{display:none}
.pcard.mini .cn.tl{inset:0;display:grid;place-items:center;align-content:center;font-size:15px}
.pcard.back{border:2px solid #22f0ff;color:transparent;box-shadow:0 8px 22px #000b,0 0 16px #22f0ff66;background:
  radial-gradient(circle at 50% 50%,#ff3dc866 0 9%,transparent 10%),
  repeating-radial-gradient(circle at 50% 50%,#22f0ff2a 0 2px,transparent 2px 10px),linear-gradient(160deg,#0b2a33,#120624)}
.pcard.back:after{content:"";position:absolute;inset:7%;border-radius:6px;border:1px solid #ff3dc888;box-shadow:inset 0 0 12px #ff3dc844}
.pcard.in{animation:warpin .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes warpin{0%{transform:translateZ(-600px) rotateY(80deg);opacity:0;filter:blur(6px) brightness(2)}60%{filter:blur(0) brightness(1.3)}100%{transform:none;opacity:1}}
.pcard.out{animation:warpout .32s ease-in forwards}
@keyframes warpout{to{transform:translate(-120%,-40%) scale(.35) rotate(-14deg);opacity:0}}
.hl-hint{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--sans);color:var(--dim);letter-spacing:.04em}
.hl-ban{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);z-index:4;font:900 clamp(15px,4.4vw,22px)/1 var(--sans);letter-spacing:.08em;padding:8px 13px;border-radius:10px;white-space:nowrap;background:#05050ae6;border:2px solid currentColor;animation:banin .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.hl-ban.win{color:var(--l);box-shadow:0 0 24px #b8ff3b99;text-shadow:0 0 10px var(--l)}
.hl-ban.bust{color:var(--r);box-shadow:0 0 20px #ff4d6d99;text-shadow:0 0 8px var(--r)}
@keyframes banin{from{transform:translate(-50%,-50%) rotate(-6deg) scale(.3);opacity:0}}

.hl-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 14px;background:linear-gradient(180deg,transparent,#05050acc 30%)}
.hl-call{min-height:72px;flex-direction:column;gap:0;padding:6px 10px;line-height:1.15;white-space:normal}
.hl-call .t{font:800 13.5px var(--sans);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.hl-call .t svg{width:16px;height:16px;flex:none}
.hl-call .m{font:900 21px var(--mono);font-variant-numeric:tabular-nums}
.hl-call .p{font:700 11px var(--mono);opacity:.8}
.hl-call:disabled{filter:saturate(.3);opacity:.38}
.hl-mult b.lost{color:var(--r);text-shadow:0 0 18px var(--r)}
.hl-call.sure .m{font-size:13px;opacity:.8}
.hl-acts .row2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.hl-acts .row2 .btn{min-height:52px;padding:0 10px}
.hl-acts kbd,.hl-keys kbd{font:700 10px var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;margin-left:4px}
.hl-keys{color:var(--faint);font-size:12px;margin-top:10px;line-height:1.9}
.hl-keys kbd{opacity:1;color:var(--dim);margin:0 2px}
@media(max-width:899px){.hl-acts kbd{display:none}}
@media(min-width:900px){.hl-stage{--cw:170px}.hl-trail{height:100px}.hl-trail .tc{--cw:48px}.hl-acts{padding:14px 18px 18px;gap:10px;max-width:640px;width:100%;margin:0 auto}.hl-call{min-height:80px}}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div id="bet"></div>
    <button class="btn big pri" id="go">Bet</button>
    <div style="margin-top:14px">
      <div class="stat-row"><span>Chain</span><b id="s-chain">0</b></div>
      <div class="stat-row"><span>Multiplier</span><b id="s-mult">1.00×</b></div>
      <div class="stat-row"><span>Cash out</span><b id="s-pay" style="color:var(--l)">0</b></div>
      <div class="stat-row"><span>Free skips left</span><b id="s-skip">3</b></div>
      <div class="stat-row"><span>Best chain</span><b id="s-best">0</b></div>
      <div class="stat-row"><span>Max win</span><b>10,000×</b></div>
    </div>
    <div class="hl-keys">Keys: <kbd>Space</kbd> launch · <kbd>↑</kbd> higher · <kbd>↓</kbd> lower · <kbd>S</kbd> skip · <kbd>C</kbd>/<kbd>Enter</kbd> cash out</div>
  </section>
  <section class="stage hl-stage" id="stage">
    <canvas id="warp" aria-hidden="true"></canvas>
    <div class="hl-flash" id="flash"></div>
    <div class="recent" id="recent"></div>
    <div class="hl-hud">
      <div class="hl-side chain"><small>Chain</small><b id="chain">0</b></div>
      <div class="hl-mult"><small>Multiplier</small><b id="mult">1.00×</b><div class="pay"><span>Payout</span><em id="pay" style="font-style:normal">0</em></div></div>
      <div class="hl-side"><small>Skips</small><b id="skips">3</b><div class="pips" id="pips"><i></i><i></i><i></i></div></div>
    </div>
    <div class="hl-trail" id="trail" aria-label="Previous cards"></div>
    <div class="hl-table"><div class="hl-slot" id="slot"><div class="ring"></div></div></div>
    <div class="hl-acts">
      <button class="btn lime hl-call" id="hi" data-d="hi" disabled><span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>Higher or same<kbd>↑</kbd></span><span class="m">-</span><span class="p">&nbsp;</span></button>
      <button class="btn pink hl-call" id="lo" data-d="lo" disabled><span class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>Lower or same<kbd>↓</kbd></span><span class="m">-</span><span class="p">&nbsp;</span></button>
      <div class="row2">
        <button class="btn" id="skip" disabled>Skip · 3<kbd>S</kbd></button>
        <button class="btn pri" id="go2">Launch</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/games/hilo.js"></script>
</body></html>
