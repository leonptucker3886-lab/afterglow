<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Lure · AFTERGLOW social casino</title>
<meta name="description" content="Night fishing on a neon lake. Lucky Lure is a free-to-play 5-reel slot with cash fish, angler wilds and boat free spins on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.panel{display:flex;flex-direction:column}
.panel .ghead{order:-3}
.ll-spinrow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.ll-spinrow .btn.big{flex:1;font-size:19px;letter-spacing:.12em;min-height:60px}
#spin{background:linear-gradient(180deg,#7dfff0,#00b8a8 55%,#0a7f9e);border-color:transparent;color:#021a1c;box-shadow:0 0 22px #22f0ffaa,inset 0 2px 0 #ffffff66}
#spin:disabled{opacity:.55}
.ll-spinrow .pt{min-width:60px;padding:0 12px;flex:none}
.ll-spinrow .pt svg{width:24px;height:24px}
.ll-opt{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px;gap:10px}
.ll-opt span{font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ll-opt small{display:block;font:500 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
@media(max-width:899px){.ll-spinrow{order:-2;position:sticky;bottom:calc(var(--bn) + env(safe-area-inset-bottom) + 8px);z-index:6}}

/* ---- stage: neon lake at night ---- */
.stage.ll{min-height:0;background:linear-gradient(180deg,#040817 0%,#061430 38%,#06283c 62%,#031a26 100%)}
.ll .sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ll .moon{position:absolute;top:54px;right:7%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fffbe0,#ffe58a 45%,#ffb43d00 72%);box-shadow:0 0 60px #ffd84d55;opacity:.8}
.ll .stars{position:absolute;inset:0 0 50% 0;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#cfe,transparent),radial-gradient(1.2px 1.2px at 46% 22%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#bdf,transparent),radial-gradient(1.4px 1.4px at 78% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 6%,#fff,transparent),radial-gradient(1px 1px at 6% 36%,#9ff,transparent),radial-gradient(1px 1px at 36% 40%,#fff,transparent);opacity:.7}
.ll .water{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,#0a4a5c55,#03222e00 30%),radial-gradient(80% 60% at 50% 100%,#0affc81c,transparent 70%);border-top:1px solid #22f0ff33;overflow:hidden}
.ll .caus{position:absolute;inset:-40%;opacity:.22;background:
  radial-gradient(closest-side,#22f0ff55,transparent) 0 0/90px 60px,
  radial-gradient(closest-side,#b8ff3b33,transparent) 45px 30px/120px 80px;
  animation:caus 14s linear infinite;will-change:transform}
.ll .caus.b{opacity:.16;animation-duration:22s;animation-direction:reverse;background:
  radial-gradient(closest-side,#8b5cff55,transparent) 0 0/140px 90px,
  radial-gradient(closest-side,#22f0ff44,transparent) 70px 20px/70px 50px}
@keyframes caus{to{transform:translate(90px,60px) rotate(2deg)}}
.bub{position:absolute;bottom:-12px;border-radius:50%;border:1px solid #9ffcffaa;background:radial-gradient(circle at 35% 35%,#ffffffaa,#22f0ff22 60%,transparent);animation:bub linear infinite;will-change:transform}
@keyframes bub{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),-70vh);opacity:0}}
body.reduced .bub,body.reduced .caus{animation:none}
@media (prefers-reduced-motion:reduce){.bub{display:none}.caus{animation:none}}

.ll-wrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 6px 8px;gap:8px}
.ll-title{font:900 clamp(18px,5vw,26px)/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#eafffb;text-shadow:0 0 10px #22f0ff,0 0 24px #0affc8aa;display:flex;align-items:center;gap:10px}
.ll-title i{font-style:normal;color:var(--l);text-shadow:0 0 10px var(--l)}

/* free spins HUD */
.ll-fs{width:min(100%,720px);display:grid;gap:6px;padding:8px 10px;border-radius:14px;background:linear-gradient(90deg,#062c3a,#0d1640);border:1px solid var(--c);box-shadow:0 0 20px #22f0ff44}
.ll-fs[hidden]{display:none}
.ll-fs .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ll-fs .row span{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.ll-fs b{font:900 18px var(--mono);color:#fff}
.ll-fs .mx b{color:var(--l);text-shadow:var(--glowl)}
.ll-fs .ct b{color:var(--y);text-shadow:0 0 10px #ffd84d88}
.ll-fs .wn b{color:var(--c);text-shadow:var(--glow)}
.trk{display:flex;align-items:center;gap:8px}
.trk .pips{display:flex;gap:5px;flex:1}
.trk .pip{flex:1;height:10px;border-radius:6px;background:#0b1a2a;border:1px solid #2a4a66;transition:background .25s,box-shadow .25s}
.trk .pip.on{background:linear-gradient(90deg,var(--l),#4dffa8);border-color:transparent;box-shadow:0 0 10px #b8ff3b}
.trk .pip.pop{animation:pop .3s}
.trk .lv{display:flex;gap:4px}
.trk .lv i{font:800 11px var(--mono);font-style:normal;padding:3px 6px;border-radius:999px;border:1px solid #2a4a66;color:var(--faint)}
.trk .lv i.on{color:#031417;background:var(--l);border-color:var(--l);box-shadow:var(--glowl)}
.trk .lv i.done{color:var(--l);border-color:#b8ff3b66}

/* reels */
.ll-frame{position:relative;width:min(100%,720px);padding:6px;border-radius:18px;background:linear-gradient(180deg,#06202e,#030b14);border:1px solid #1f5a6e;box-shadow:0 0 0 1px #22f0ff22,0 0 34px #0affc833,inset 0 0 30px #000}
.ll-frame:before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(90deg,var(--c),var(--l),var(--c));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none}
.fsmode .ll-frame{box-shadow:0 0 0 1px #b8ff3b55,0 0 44px #b8ff3b44,inset 0 0 30px #000}
.ll-reels{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1vw,8px)}
.reel{position:relative;aspect-ratio:1/3;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#041624,#08304a 50%,#041624);box-shadow:inset 0 10px 14px -6px #000,inset 0 -10px 14px -6px #000}
.reel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#020a12cc,transparent 14%,transparent 86%,#020a12cc);border-radius:10px}
.reel.antic{box-shadow:0 0 0 2px var(--y),0 0 26px #ffd84d,inset 0 0 22px #ffd84d88;animation:antic .5s ease-in-out infinite alternate}
@keyframes antic{to{box-shadow:0 0 0 2px var(--c),0 0 34px #22f0ff,inset 0 0 26px #22f0ff88}}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.reel.spinning .strip{filter:url(#vblur)}
.cell{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;transition:opacity .25s}
.cell svg{width:86%;height:86%;overflow:visible}
.cell.k-j svg{filter:drop-shadow(0 0 4px #22f0ffaa)}.cell.k-q svg{filter:drop-shadow(0 0 4px #8b5cffcc)}
.cell.k-k svg{filter:drop-shadow(0 0 4px #b8ff3baa)}.cell.k-a svg{filter:drop-shadow(0 0 4px #ff3dc8aa)}
.cell.k-F svg{width:80%;height:80%;margin-top:-14%;filter:drop-shadow(0 0 6px currentColor)}
.cell.k-W svg{filter:drop-shadow(0 0 8px #b8ff3b)}.cell.k-S svg{filter:drop-shadow(0 0 8px #ffd84d)}
.fv{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font:900 clamp(10px,2.9vw,16px)/1 var(--mono);padding:3px 6px;border-radius:999px;background:#02121bdd;border:1px solid currentColor;color:#fff;white-space:nowrap;text-shadow:0 0 6px currentColor;max-width:96%;overflow:hidden}
.ll-reels.won .cell{opacity:.3}
.ll-reels.won .cell.win{opacity:1}
.cell.win svg{animation:pulse .55s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.cell.land svg{animation:pop .3s}
.cell.hook{opacity:1!important}
.cell.hook:before{content:"";position:absolute;inset:6%;border-radius:12px;border:2px solid var(--y);box-shadow:0 0 14px #ffd84d,inset 0 0 12px #ffd84d66;animation:fade .2s}
.cell.caught svg,.cell.caught .fv{opacity:.35}
.cell.angl:before{content:"";position:absolute;inset:4%;border-radius:12px;border:2px solid var(--l);box-shadow:0 0 18px #b8ff3b,inset 0 0 14px #b8ff3b66}
.ll-lines,.ll-cast{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ll-lines polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s ease-out forwards,lglow 1s ease-in-out .45s infinite alternate}
.ll-lines polyline.core{stroke:#fff;stroke-width:1.6;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lglow{to{stroke-width:7;opacity:.75}}
.ll-cast path{fill:none;stroke:#eaffd0;stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px #b8ff3b);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .28s ease-out forwards}
.ll-fly{position:absolute;z-index:4;pointer-events:none;display:grid;place-items:center;will-change:transform}
.ll-fly svg{width:70%;height:70%;filter:drop-shadow(0 0 8px currentColor)}
.ll-fly b{position:absolute;bottom:-4px;font:900 13px var(--mono);color:#fff;background:#02121bee;border:1px solid currentColor;border-radius:999px;padding:2px 6px;white-space:nowrap}
.ll-pop{position:absolute;z-index:5;pointer-events:none;font:900 clamp(14px,3.6vw,20px) var(--mono);color:var(--y);text-shadow:0 0 10px #ffd84d,0 0 2px #000;transform:translate(-50%,-50%);animation:rise 1s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translate(-50%,-20%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}to{opacity:0;transform:translate(-50%,-160%)}}
.ll-splash{position:absolute;z-index:4;pointer-events:none;border-radius:50%;border:3px solid #9ffcff;box-shadow:0 0 18px #22f0ff;transform:translate(-50%,-50%) scale(.2);animation:splash .6s ease-out forwards}
@keyframes splash{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}

.ll-banner{position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;border-radius:18px;background:radial-gradient(circle,#063a46ee,#020a12f2 75%);cursor:pointer;animation:fade .25s}
.ll-banner[hidden]{display:none}
.ll-banner .in{animation:bw .5s cubic-bezier(.2,1.6,.4,1);padding:12px}
.ll-banner .k{font:800 13px var(--sans);letter-spacing:.25em;color:var(--c);text-transform:uppercase}
.ll-banner .t{font:900 clamp(28px,8vw,60px)/1.05 var(--sans);letter-spacing:.04em;background:linear-gradient(180deg,#fff,var(--l) 45%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #22f0ffaa);margin:6px 0}
.ll-banner .s{font:800 clamp(13px,3.6vw,18px) var(--mono);color:var(--y);text-shadow:0 0 10px #ffd84d88}
.ll-banner .f{font:600 12px var(--sans);color:var(--faint);margin-top:12px}
.ll-banner svg{width:clamp(54px,14vw,96px);height:auto;margin:0 auto 4px;filter:drop-shadow(0 0 14px #b8ff3b);animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-4deg)}}

.ll-win{width:min(100%,720px);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 14px;border-radius:12px;background:#020c14cc;border:1px solid var(--line)}
.ll-win small{color:var(--dim);font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ll-win b{font:900 24px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.ll-win.on{border-color:var(--l);box-shadow:var(--glowl)}
.ll-win.on b{color:var(--l);text-shadow:var(--glowl)}
@media(min-width:900px){.ll-wrap{padding:14px 20px 16px;gap:12px}.ll-frame{padding:12px}.ll-win b{font-size:30px}.ll-fs b{font-size:22px}.ll-fs .row{font-size:12px}}
@media(max-width:899px){.ll-title{display:none}}

/* paytable */
.ptab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ptab .pr{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.ptab .pr.wide{grid-column:1/-1}
.ptab svg{width:46px;height:46px;flex:none;overflow:visible}
.ptab .pv{font:700 12px/1.45 var(--mono);color:var(--txt)}
.ptab .pv i{font-style:normal;color:var(--faint);display:inline-block;width:22px}
.ptab .pv.txt{font-family:var(--sans);font-weight:500;color:var(--dim)}
.fvals{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fvals span{font:800 12px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.plines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.plines div{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:13px 3px 3px}
.plines svg{width:100%;height:auto}
.plines span{position:absolute;top:1px;left:4px;font:800 9px var(--mono);color:var(--faint)}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div class="ll-spinrow">
      <button class="btn big" id="spin" aria-label="Spin (space bar)">SPIN</button>
      <button class="btn pt" id="ptbtn" aria-label="Paytable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
    </div>
    <div id="betslot"></div>
    <div class="ll-opt"><span>Turbo<small>Faster reels and reeling</small></span><label class="toggle"><input type="checkbox" id="turbo" aria-label="Turbo spins"><i></i></label></div>
    <div>
      <div class="stat-row"><span>Paylines</span><b>10</b></div>
      <div class="stat-row"><span>Free spins</span><b>3+ boats</b></div>
      <div class="stat-row"><span>Last win</span><b id="lastwin">-</b></div>
      <div class="stat-row"><span>RTP · max win</span><b>96.3% · 5,000×</b></div>
    </div>

  </section>
  <section class="stage ll" id="stage">
    <div class="sky" aria-hidden="true"><div class="stars"></div><div class="moon"></div><div class="water" id="water"><div class="caus"></div><div class="caus b"></div></div></div>
    <div class="recent" id="recent" style="position:relative"></div>
    <div class="ll-wrap">
      <div class="ll-title"><span>Lucky</span><i>Lure</i></div>
      <div class="ll-fs" id="fsbar" hidden>
        <div class="row">
          <span>Spins<b id="fsleft">0</b></span>
          <span class="mx">Multiplier<b><span id="fsmult">1</span>×</b></span>
          <span class="ct">Fish caught<b id="fscaught">0</b></span>
          <span class="wn">Won<b id="fswon">0</b></span>
        </div>
        <div class="trk"><div class="pips" id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="lv" id="lvls"><i class="on">1×</i><i>2×</i><i>3×</i><i>10×</i></div></div>
      </div>
      <div class="ll-frame" id="frame">
        <div class="ll-reels" id="reels"></div>
        <svg class="ll-lines" id="lines" aria-hidden="true"></svg>
        <svg class="ll-cast" id="cast" aria-hidden="true"></svg>
        <div class="ll-banner" id="banner" hidden></div>
      </div>
      <div class="ll-win" id="winbox" aria-live="polite"><small id="winmsg">10 lines · cash fish · angler free spins</small><b id="winamt">0</b></div>
    </div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="vblur" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 7"/></filter></svg>
<script type="module" src="/games/fishing.js"></script>
</body></html>
