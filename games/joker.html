<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Joker · AFTERGLOW social casino</title>
<meta name="description" content="Neon Joker: a free-to-play retro-modern fruit machine with expanding sticky jokers, respins, star scatters and a red/black gamble on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.panel{display:flex;flex-direction:column}
.panel .ghead{order:-3}
.jk-spinrow{display:flex;gap:8px;margin-bottom:12px}
.jk-spinrow .btn.big{flex:1;font-size:19px;letter-spacing:.12em;min-height:60px}
#spin{background:linear-gradient(180deg,#ff7be0,#c21d97);color:#fff;border-color:transparent;box-shadow:0 0 22px #ff3dc888}
#spin.collect{background:linear-gradient(180deg,#d4ff7a,#86d10f);color:#122000;box-shadow:var(--glowl)}
.jk-spinrow .pt{min-width:60px;padding:0 12px;flex:none}
.jk-spinrow .pt svg{width:24px;height:24px}
.jk-opt{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:8px;gap:10px}
.jk-opt span{font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.jk-opt small{display:block;font:500 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
@media(max-width:899px){.jk-spinrow{order:-2;position:sticky;bottom:calc(var(--bn) + env(safe-area-inset-bottom) + 8px);z-index:6;background:var(--panel);padding:4px 0;margin:-4px 0 8px}}

.stage.jk{min-height:0;background:radial-gradient(110% 80% at 50% 0%,#2a0b33,#0a0612 60%,#06120c)}
.jk-wrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 6px 8px;gap:8px}
/* cabinet with chasing marquee lights */
.jk-cab{position:relative;width:min(100%,780px);padding:12px;border-radius:22px;background:linear-gradient(180deg,#241032,#120818 60%,#0c1a12);box-shadow:0 0 0 2px #ff3dc8,0 0 30px #ff3dc855,0 0 60px #b8ff3b22,inset 0 0 30px #000}
.jk-bulbs{position:absolute;inset:4px;border-radius:18px;pointer-events:none;padding:3px;
  background:repeating-linear-gradient(90deg,#ffd84d 0 5px,transparent 5px 14px,#ff3dc8 14px 19px,transparent 19px 28px,#b8ff3b 28px 33px,transparent 33px 42px);background-size:42px 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:chase 1.2s linear infinite;opacity:.95}
.jk-cab.hot .jk-bulbs{animation-duration:.35s}
@keyframes chase{to{background-position:42px 0}}
.jk-sign{text-align:center;padding:2px 0 8px;font:900 clamp(20px,6vw,34px)/1 var(--sans);letter-spacing:.14em;color:#fff;text-shadow:0 0 6px #ff3dc8,0 0 18px #ff3dc8,0 0 34px #ff3dc8aa}
.jk-sign b{color:#eaffc0;text-shadow:0 0 6px #b8ff3b,0 0 18px #b8ff3b,0 0 34px #b8ff3b99}
.jk-sign i{font-style:normal;animation:flick 4s infinite}
@keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.35}}
.jk-board{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px;align-items:stretch}
.jk-ln{display:grid;grid-template-rows:repeat(3,1fr);padding:6px 0}
.jk-ln div{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.jk-ln span{display:grid;place-items:center;width:20px;height:15px;border-radius:5px;font:800 10px var(--mono);color:#fff;background:#1a1028;border:1px solid var(--lc);box-shadow:0 0 5px var(--lc);opacity:.75;transition:transform .2s,opacity .2s}
.jk-ln span.on{background:var(--lc);color:#05050a;opacity:1;transform:scale(1.15);box-shadow:0 0 12px var(--lc)}
@media(max-width:899px){.jk-ln span{width:18px;height:12px;font-size:9px;border-radius:4px}.jk-ln div{gap:1px}}
@media(min-width:900px){.jk-ln span{width:26px;height:20px;font-size:12px}.jk-ln div{gap:4px}}
.jk-frame{position:relative;padding:6px;border-radius:14px;background:#06040a;box-shadow:inset 0 0 0 1px #ff3dc855,inset 0 0 20px #000}
.jk-reels{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(3px,1vw,8px)}
.reel{position:relative;aspect-ratio:1/3;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#120a1c,#1d1030 50%,#120a1c);box-shadow:inset 0 10px 14px -6px #000,inset 0 -10px 14px -6px #000}
.reel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#05050acc,transparent 14%,transparent 86%,#05050acc);border-radius:10px;z-index:1}
.reel.antic{box-shadow:0 0 0 2px var(--y),0 0 26px #ffd84d,inset 0 0 22px #ffd84d88;animation:antic .45s ease-in-out infinite alternate}
@keyframes antic{to{box-shadow:0 0 0 2px var(--p),0 0 30px #ff3dc8,inset 0 0 26px #ff3dc888}}
.strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.reel.spinning .strip{filter:url(#jkblur)}
.cell{width:100%;aspect-ratio:1;display:grid;place-items:center;transition:opacity .25s}
.cell svg{width:84%;height:84%;overflow:visible}
.jk-reels.won .cell{opacity:.3}
.jk-reels.won .cell.win{opacity:1}
.cell.win svg{animation:pulse .55s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12);filter:brightness(1.3)}}
.cell.land svg{animation:pop .3s}
.cell.k-J svg{filter:drop-shadow(0 0 6px #ff3dc8)}
.cell.k-S svg{filter:drop-shadow(0 0 7px #ffd84d)}
/* expanded joker */
.jk-big{position:absolute;inset:0;z-index:2;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px var(--l),0 0 22px #b8ff3b,inset 0 0 18px #ff3dc8;animation:grow .5s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% var(--oy,50%)}
.jk-big svg{width:100%;height:100%;display:block}
.jk-big .face{transform-origin:50px 150px;transform-box:view-box}
.jk-big.laugh .face{animation:laugh .22s ease-in-out 6 alternate}
.jk-big .ha{position:absolute;left:50%;top:64%;transform:translateX(-50%);font:900 clamp(11px,3vw,18px) var(--sans);color:var(--y);text-shadow:0 0 8px #ff3dc8;white-space:nowrap;opacity:0;pointer-events:none}
.jk-big.laugh .ha{animation:ha 1.4s ease-out forwards}
.jk-reels.won .jk-big{opacity:1}
@keyframes grow{from{transform:scaleY(.33);opacity:.4}}
@keyframes laugh{from{transform:rotate(-7deg) translateY(2px)}to{transform:rotate(7deg) translateY(-3px)}}
@keyframes ha{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.jk-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.jk-lines polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s ease-out forwards,lglow 1s ease-in-out .45s infinite alternate}
.jk-lines polyline.core{stroke:#fff;stroke-width:1.6;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lglow{to{stroke-width:7;opacity:.75}}
/* banners + gamble */
.jk-banner{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;border-radius:22px;background:radial-gradient(circle,#3a0b44ee,#05050af0 75%);cursor:pointer;animation:fade .25s}
.jk-banner[hidden]{display:none}
.jk-banner .in{animation:bw .5s cubic-bezier(.2,1.6,.4,1);padding:12px}
.jk-banner .k{font:800 13px var(--sans);letter-spacing:.25em;color:var(--l);text-transform:uppercase}
.jk-banner .t{font:900 clamp(30px,8vw,60px)/1.05 var(--sans);letter-spacing:.04em;background:linear-gradient(180deg,#fff,var(--y) 40%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff3dc8aa);margin:6px 0}
.jk-banner .s{font:800 clamp(13px,3.6vw,17px) var(--mono);color:var(--c);text-shadow:var(--glow)}
.jk-gam{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px 10px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#1d0b2aee,#05050af4 80%);animation:fade .2s}
.jk-gam[hidden]{display:none}
.jk-gam .gt{font:900 13px var(--sans);letter-spacing:.2em;color:var(--y);text-transform:uppercase;text-shadow:0 0 10px #ffd84d88}
.jk-gam .gt small{display:block;text-align:center;font:600 11px var(--sans);letter-spacing:.06em;color:var(--dim);text-transform:none;margin-top:2px}
.jk-gam .gw{display:flex;gap:14px;align-items:baseline;font:800 13px var(--sans);color:var(--dim)}
.jk-gam .gw b{font:900 clamp(20px,5.5vw,28px) var(--mono);color:var(--l);text-shadow:var(--glowl)}
.jk-gam .gmid{display:flex;align-items:center;gap:clamp(10px,3vw,22px)}
.jk-card{width:clamp(56px,15vw,96px);aspect-ratio:5/7;perspective:600px}
.jk-card .ci{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.jk-card.flip .ci{transform:rotateY(180deg)}
.jk-card .cf,.jk-card .cb{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.jk-card .cb{background:repeating-linear-gradient(45deg,#ff3dc8 0 6px,#2a0b3a 6px 12px);border:3px solid #fff;box-shadow:0 0 18px #ff3dc8}
.jk-card .cf{transform:rotateY(180deg);background:#fdf8ff;border:3px solid var(--y);font-size:clamp(34px,10vw,54px)}
.jk-card .cf.red{color:#e8174a}.jk-card .cf.black{color:#14141f}
.jk-gam .gbtns{display:flex;gap:8px;width:min(100%,360px)}
.jk-gam .gbtns .btn{flex:1;min-height:48px}
.btn.red{background:linear-gradient(180deg,#ff6b8a,#c2183f);color:#fff;border-color:transparent;box-shadow:0 0 16px #ff4d6d88}
.btn.blk{background:linear-gradient(180deg,#3a3a52,#14141f);color:#fff;border-color:#8b8bb0}
.jk-gam .ghist{display:flex;gap:4px;min-height:20px;font:800 14px var(--mono)}
.jk-gam .ghist span{padding:0 5px;border-radius:5px;background:#fdf8ff}
.jk-gam .gres{min-height:20px;font:900 15px var(--sans);letter-spacing:.06em}
.jk-gam .collect{width:min(100%,360px);min-height:50px}
.jk-gam .gsteps{display:flex;gap:4px}
.jk-gam .gsteps i{width:20px;height:6px;border-radius:3px;background:var(--line2)}
.jk-gam .gsteps i.on{background:var(--l);box-shadow:var(--glowl)}
/* readouts */
.jk-rsp{display:flex;gap:6px;align-items:center;font:800 12px var(--sans);letter-spacing:.12em;color:var(--l);text-transform:uppercase;min-height:20px}
.jk-rsp i{width:12px;height:12px;border-radius:50%;border:2px solid var(--l);display:inline-block}
.jk-rsp i.on{background:var(--l);box-shadow:var(--glowl)}
.jk-rsp[hidden]{visibility:hidden;display:flex}
.jk-win{width:min(100%,780px);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 14px;border-radius:12px;background:#0b0b18cc;border:1px solid var(--line)}
.jk-win small{color:var(--dim);font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jk-win b{font:900 24px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.jk-win.on{border-color:var(--l);box-shadow:var(--glowl)}
.jk-win.on b{color:var(--l);text-shadow:var(--glowl)}
.jk-hud{display:flex;justify-content:center;gap:10px;padding:2px 12px 12px;flex-wrap:wrap}
.jk-hud div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;text-align:center;min-width:110px;flex:1;max-width:200px}
.jk-hud small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.jk-hud b{font:800 16px var(--mono)}
@media(max-width:899px){.jk-hud{display:none}.jk-cab{padding:9px}.jk-sign{padding-bottom:6px}}
@media(min-width:900px){.jk-wrap{padding:16px 20px 8px;gap:10px}.jk-cab{padding:16px}.jk-win b{font-size:30px}}
body.reduced .jk-bulbs{animation:none}
@media(prefers-reduced-motion:reduce){.jk-bulbs{animation:none}}
/* paytable */
.ptab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ptab .pr{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.ptab .pr.wide{grid-column:1/-1}
.ptab svg{width:44px;height:44px;flex:none;overflow:visible}
.ptab .pv{font:700 12px/1.45 var(--mono);color:var(--txt)}
.ptab .pv i{font-style:normal;color:var(--faint);display:inline-block;width:22px}
.ptab .pv.txt{font-family:var(--sans);font-weight:500;color:var(--dim)}
.plines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.plines div{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:13px 3px 3px}
.plines svg{width:100%;height:auto}
.plines span{position:absolute;top:1px;left:4px;font:800 9px var(--mono);color:var(--faint)}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div class="jk-spinrow">
      <button class="btn big" id="spin" aria-label="Spin (space bar)">SPIN</button>
      <button class="btn pt" id="ptbtn" aria-label="Paytable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
    </div>
    <div id="betslot"></div>
    <div class="jk-opt"><span>Turbo<small>Faster reels</small></span><label class="toggle"><input type="checkbox" id="turbo" aria-label="Turbo spins"><i></i></label></div>
    <div class="jk-opt"><span>Offer gamble<small>Red/black double after wins under 50×</small></span><label class="toggle"><input type="checkbox" id="gamopt" aria-label="Offer gamble after wins" checked><i></i></label></div>
    <div style="margin-top:4px">
      <div class="stat-row"><span>Line bet × 10 lines</span><b id="linebet">-</b></div>
      <div class="stat-row"><span>Last win</span><b id="lastwin">0</b></div>
      <div class="stat-row"><span>RTP</span><b>96.2%</b></div>
    </div>
    <p class="faint" style="font-size:12px;margin:10px 0 0">Tip: press Space to spin (or collect during a gamble).</p>
  </section>
  <section class="stage jk" id="stage">
    <div class="recent" id="recent"></div>
    <div class="jk-wrap">
      <div class="jk-cab" id="cab">
        <div class="jk-bulbs" aria-hidden="true"></div>
        <div class="jk-sign">NE<i>O</i>N <b>JOKER</b></div>
        <div class="jk-board">
          <div class="jk-ln" id="lnL" aria-hidden="true"></div>
          <div class="jk-frame" id="frame">
            <div class="jk-reels" id="reels"></div>
            <svg class="jk-lines" id="lines" aria-hidden="true"></svg>
          </div>
          <div class="jk-ln" id="lnR" aria-hidden="true"></div>
        </div>
        <div class="jk-banner" id="banner" hidden></div>
      </div>
      <div class="jk-rsp" id="rsp" hidden><span>Respin</span><i></i><i></i><i></i></div>
      <div class="jk-win" id="winbox" aria-live="polite"><small id="winmsg">Jokers expand, stick and respin</small><b id="winamt">0</b></div>
      <div class="jk-gam" id="gam" hidden>
        <div class="gt">Gamble · optional<small>Double or nothing. Or just collect.</small></div>
        <div class="gw"><span>Win</span><b id="gwin">0</b><span>→ <span id="gnext" class="mono" style="color:var(--y)">0</span></span></div>
        <div class="gmid">
          <button class="btn red" id="gred" aria-label="Red">RED</button>
          <div class="jk-card" id="gcard"><div class="ci"><div class="cb"></div><div class="cf" id="gface"></div></div></div>
          <button class="btn blk" id="gblk" aria-label="Black">BLACK</button>
        </div>
        <div class="gsteps" id="gsteps"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="gres" id="gres"></div>
        <button class="btn big lime collect" id="gcol">Collect</button>
        <div class="ghist" id="ghist"></div>
      </div>
    </div>
    <div class="jk-hud"><div><small>Last win</small><b id="lastwin2">0</b></div><div><small>Total bet</small><b id="totbet">0</b></div></div>
  </section>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="jkblur" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur stdDeviation="0 7"/></filter></svg>
<script type="module" src="/games/joker.js"></script>
</body></html>
