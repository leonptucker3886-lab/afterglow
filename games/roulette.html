<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit Roulette · AFTERGLOW social casino</title>
<meta name="description" content="European single-zero roulette in neon orbit. Stack chips, spin the wheel, chase the zero. A free-to-play game on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
/* ---------- chips ---------- */
.chip{--c:#22f0ff;position:relative;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 11px var(--mono);letter-spacing:-.02em;
  background:radial-gradient(circle,#0c0c1a 0 50%,var(--c) 51% 56%,#0c0c1a 57% 64%,transparent 65%),repeating-conic-gradient(var(--c) 0 22.5deg,#10101f 22.5deg 45deg);
  box-shadow:0 0 0 1.5px var(--c),0 0 10px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 6px #0008;text-shadow:0 0 6px var(--c)}
.chip[data-v="10"]{--c:#22f0ff}.chip[data-v="100"]{--c:#ff3dc8}.chip[data-v="500"]{--c:#b8ff3b}
.chip[data-v="1000"]{--c:#8b5cff}.chip[data-v="10000"]{--c:#ffd84d}.chip[data-v="100000"]{--c:#ff8a3d}
.tray{display:flex;gap:6px;justify-content:space-between;padding:8px 0 4px}
.tray button{flex:1 1 0;max-width:54px;aspect-ratio:1;min-width:44px;border:0;padding:0;cursor:pointer;font-size:12px;transition:transform .15s,box-shadow .2s,filter .2s;filter:saturate(.75) brightness(.8)}
.tray button.on{transform:translateY(-6px) scale(1.06);filter:none;box-shadow:0 0 0 2px var(--c),0 0 18px var(--c),0 0 34px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 6px #0008}
.tray button:disabled{opacity:.4;cursor:not-allowed}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.acts4 .btn{min-height:44px;padding:0 4px;font-size:13px}
.spinrow{display:flex;gap:10px;align-items:stretch}
.stake{flex:0 0 auto;min-width:104px;display:flex;flex-direction:column;justify-content:center;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:4px 12px}
.stake small{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stake b{font:800 17px var(--mono);color:var(--y)}
.spinrow .btn.big{flex:1}
.pmore{margin-top:12px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px;color:var(--dim)}
@media(max-width:899px){
  .game .panel{position:sticky;bottom:calc(var(--bn) + env(safe-area-inset-bottom));z-index:20;padding:10px 12px;box-shadow:0 -12px 30px #000c;border-color:var(--line2)}
  .game .panel .ghead{margin-bottom:2px}
  .game .panel .ghead h1{font-size:16px}
  .pmore{display:none}
}

/* ---------- stage ---------- */
.game .rstage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"recent" "wheel" "table" "side";gap:0}
.rstage>.recent{grid-area:recent}
.recent span.r{color:#fff;background:#d42aa6;box-shadow:0 0 10px #ff3dc888}
.recent span.k{color:var(--c);background:#10101f;box-shadow:inset 0 0 0 1px var(--c)}
.recent span.z{color:#122000;background:var(--l);box-shadow:var(--glowl)}
.recent span{min-width:30px;text-align:center}
.recent:empty:before{content:"No spins yet";color:var(--faint);font-size:12px;align-self:center}
.wheelbox{grid-area:wheel;display:flex;flex-direction:column;align-items:center;padding:12px 12px 4px}
.wheel{position:relative;width:min(260px,72vw);aspect-ratio:1}
.wheel canvas{width:100%;height:100%;display:block}
.hub{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;pointer-events:none}
.hub b{font:900 clamp(30px,10vw,46px)/1 var(--mono);opacity:0;transform:scale(.4);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.hub.show{background:radial-gradient(circle,#0b0b18 58%,transparent 72%)}
.hub.show b{opacity:1;transform:none}
.hub.red b{color:#ff5fd2;text-shadow:0 0 16px #ff3dc8,0 0 4px #ff3dc8}
.hub.black b{color:#e9fbff;text-shadow:0 0 14px #22f0ff,0 0 3px #22f0ff}
.hub.green b{color:var(--l);text-shadow:0 0 16px #b8ff3b,0 0 4px #b8ff3b}
.resline{min-height:30px;margin-top:6px;font:800 15px var(--mono);text-align:center;letter-spacing:.02em}
.resline.w{color:var(--l);text-shadow:var(--glowl);animation:pop .3s}
.resline.l{color:var(--dim)}
.resline small{display:block;font:600 11px var(--sans);color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

.side{grid-area:side;padding:4px 12px 14px;display:grid;gap:10px}
.hc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.hc h3{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:8px}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bars i{display:block;height:100%;transition:width .4s}
.bars .r{background:#ff3dc8;box-shadow:0 0 10px #ff3dc8}.bars .k{background:#2a2a48}.bars .z{background:var(--l)}
.legend{display:flex;justify-content:space-between;font:700 12px var(--mono);margin-top:6px}
.legend .r{color:#ff5fd2}.legend .k{color:var(--c)}.legend .z{color:var(--l)}
.hot{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--faint);flex-wrap:wrap}
.hot span{display:flex;gap:4px;align-items:center}
.hot em{font:800 12px var(--mono);font-style:normal;padding:1px 6px;border-radius:6px}
.hot em.r{background:#d42aa6;color:#fff}.hot em.k{background:#10101f;color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}.hot em.z{background:var(--l);color:#122000}

/* ---------- table ---------- */
.twrap{grid-area:table;padding:6px 10px 12px}
.table{display:grid;gap:4px;grid-template-columns:44px 44px repeat(3,1fr);grid-template-rows:48px repeat(12,46px) 44px;user-select:none;-webkit-user-select:none}
.spot{grid-row:var(--vr)/span var(--vrs,1);grid-column:var(--vc)/span var(--vcs,1);position:relative;border-radius:8px;border:1px solid var(--line2);background:#0d0d1d;color:var(--txt);
  font:800 15px var(--mono);cursor:pointer;display:grid;place-items:center;padding:0;transition:box-shadow .2s,transform .08s,opacity .2s,border-color .2s;touch-action:manipulation;min-width:0}
.spot:active:not(:disabled){transform:scale(.96)}
.spot:hover:not(:disabled){border-color:var(--c)}
.spot:disabled{cursor:default}
.spot.red{background:linear-gradient(180deg,#a3197f,#6d0f55);border-color:#ff3dc8;box-shadow:inset 0 0 12px #ff3dc855,0 0 6px #ff3dc844;color:#fff}
.spot.black{background:linear-gradient(180deg,#191a30,#0d0e1d);border-color:#22f0ffaa;box-shadow:inset 0 0 10px #22f0ff22;color:#d9fbff}
.spot.green{background:linear-gradient(180deg,#2a4a06,#132402);border-color:var(--l);box-shadow:inset 0 0 14px #b8ff3b55,0 0 12px #b8ff3b55;color:var(--l);text-shadow:0 0 8px #b8ff3b;font-size:20px}
.spot.out{font:800 12px var(--sans);letter-spacing:.04em;color:var(--dim);text-transform:uppercase}
.spot .lbl{transition:all .15s;pointer-events:none}
.spot.out .lbl{writing-mode:vertical-rl;transform:rotate(180deg)}
.spot .dia{display:block;width:20px;height:20px;transform:rotate(45deg);border-radius:3px}
.spot .dia.r{background:#ff3dc8;box-shadow:0 0 10px #ff3dc8}
.spot .dia.k{background:#141428;border:2px solid var(--c);box-shadow:0 0 8px #22f0ff88}
.spot.has .lbl{position:absolute;left:5px;top:3px;font-size:10px;opacity:.75}
.spot.out.has .lbl{writing-mode:horizontal-tb;transform:none;font-size:9px;left:4px;top:3px}
.spot.has .dia{width:9px;height:9px;border-width:1px}
.spot .stk{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none}
.spot .stk .chip{position:absolute;inset:0;font-size:9px;animation:drop .2s ease-out}
.spot .stk .chip:not(:last-child){color:transparent;text-shadow:none}
@keyframes drop{from{transform:translateY(-14px) scale(1.2);opacity:0}}
.table.won .spot{opacity:.55}
.table.won .spot.lost{opacity:.85}
.table.won .spot.hit{opacity:1;border-color:#fff;box-shadow:0 0 0 2px var(--y),0 0 22px #ffd84daa;animation:hitp 1s ease-in-out 2}
.table.won .spot.lost .stk{opacity:.6;filter:grayscale(.6)}
@keyframes hitp{50%{box-shadow:0 0 0 2px var(--y),0 0 34px #ffd84d}}

@media(min-width:900px){
  .game .rstage{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"recent recent" "wheel side" "table table";align-content:start}
  .wheelbox{padding:16px 12px 4px 20px}
  .wheel{width:290px}
  .side{padding:16px 20px 8px 8px;align-content:start}
  .twrap{padding:10px 18px 18px}
  .table{grid-template-columns:52px repeat(12,1fr) 52px;grid-template-rows:repeat(3,54px) 44px 44px}
  .spot{grid-row:var(--hr)/span var(--hrs,1);grid-column:var(--hc)/span var(--hcs,1)}
  .spot.out .lbl{writing-mode:horizontal-tb;transform:none}
  .spot.green{font-size:24px}
  .qside{display:none!important}
}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div class="tray" id="tray" role="radiogroup" aria-label="Chip value"></div>
    <div class="acts4">
      <button class="btn sm" id="undo">Undo</button>
      <button class="btn sm" id="clear">Clear</button>
      <button class="btn sm" id="dbl">Double</button>
      <button class="btn sm" id="rebet">Rebet</button>
    </div>
    <div class="spinrow">
      <div class="stake"><small>Total stake</small><b id="total">0</b></div>
      <button class="btn big pri" id="spin">Spin</button>
    </div>
    <div class="pmore">
      <div class="stat-row"><span>Bets on table</span><b id="nbets">0</b></div>
      <div class="stat-row"><span>Max total stake</span><b>1,000,000</b></div>
      <div class="stat-row"><span>Last win</span><b id="lastwin">-</b></div>
      <div class="qrow"><span>Quick spin</span><label class="toggle"><input type="checkbox" class="qs" aria-label="Quick spin"><i></i></label></div>
    </div>
  </section>
  <section class="stage rstage">
    <div class="recent" id="recent" aria-label="Recent results"></div>
    <div class="wheelbox">
      <div class="wheel"><canvas id="wheel" aria-label="Roulette wheel" role="img"></canvas><div class="hub" id="hub"><b id="hubn"></b></div></div>
      <div class="resline" id="resline" aria-live="polite"><small>Place chips, then spin</small></div>
    </div>
    <div class="twrap"><div class="table" id="table"></div></div>
    <div class="side">
      <div class="hc" id="hc">
        <h3><span>Hot / cold</span><span class="faint" id="hcn">last 0 spins</span></h3>
        <div class="bars"><i class="r" id="br"></i><i class="z" id="bz"></i><i class="k" id="bk"></i></div>
        <div class="legend"><span class="r" id="lr">Red 0%</span><span class="z" id="lz">0 0%</span><span class="k" id="lk">Black 0%</span></div>
        <div class="hot" id="hot"></div>
      </div>
      <div class="qrow hc qside" style="padding:8px 12px"><span>Quick spin</span><label class="toggle"><input type="checkbox" class="qs" aria-label="Quick spin"><i></i></label></div>
    </div>
  </section>
</main>
<script type="module" src="/games/roulette.js"></script>
</body></html>
