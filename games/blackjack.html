<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon 21 · AFTERGLOW social casino</title>
<meta name="description" content="Neon 21: six-deck blackjack under the neon. Blackjack pays 3 to 2, dealer stands on 17. Free to play on AFTERGLOW. Play money only.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.stage.felt{background:radial-gradient(120% 80% at 50% 35%,#0f4a52 0%,#0b2a3a 38%,#1a0f3a 72%,#08060f 100%);box-shadow:inset 0 0 80px #000b,inset 0 0 0 1px #22f0ff22}
.felt:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 52%,#22f0ff10,transparent 70%),repeating-radial-gradient(circle at 50% 40%,#ffffff03 0 2px,transparent 2px 5px)}
.tbl{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:10px 10px 8px;--cw:62px;--ov:-30px}
@media(min-width:900px){.tbl{--cw:86px;--ov:-40px;padding:22px 20px 16px}}
.shoe{position:absolute;top:10px;right:10px;width:46px;height:58px;z-index:1}
.shoe i{position:absolute;inset:0;border-radius:6px;border:1px solid #ff3dc8aa;background:repeating-linear-gradient(45deg,#2a0f4a 0 4px,#170a2e 4px 8px);box-shadow:0 0 10px #ff3dc844}
.shoe i:nth-child(1){transform:translate(-4px,4px) rotate(-6deg)}.shoe i:nth-child(2){transform:translate(-2px,2px) rotate(-3deg)}
.shoe b{position:absolute;inset:auto -4px -8px -8px;height:18px;border-radius:5px;background:linear-gradient(180deg,#24244a,#11112a);border:1px solid var(--line2);font:800 8px var(--sans);letter-spacing:.14em;color:var(--c);display:grid;place-items:center;text-shadow:0 0 6px var(--c)}
@media(min-width:900px){.shoe{top:16px;right:18px;width:60px;height:78px}}
.zone{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:calc(var(--cw)*1.4 + 32px)}
.zone .who{font:800 10px var(--sans);letter-spacing:.2em;color:#ffffff66;text-transform:uppercase}
@media(max-width:899px){.zone .who{display:none}.zone{gap:5px}}
.hands{display:flex;justify-content:center;gap:14px;width:100%}
.hwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px 8px;border-radius:14px;border:1px solid transparent;transition:border-color .2s,box-shadow .2s,opacity .2s,background .2s}
.hands.split .hwrap{--ov:-40px}
@media(min-width:900px){.hands.split .hwrap{--ov:-54px}}
.hands.split .hwrap.on{border-color:var(--c);box-shadow:0 0 18px #22f0ff55,inset 0 0 18px #22f0ff22;background:#22f0ff0a}
.hands.split .hwrap:not(.on){opacity:.72}
.hands.split.fin .hwrap{opacity:1}
.cards{display:flex;justify-content:center;min-height:calc(var(--cw)*1.4);position:relative}
.tot{font:800 13px var(--mono);padding:3px 11px;border-radius:999px;background:#05050acc;border:1px solid var(--line2);color:var(--hi);min-width:44px;text-align:center;min-height:24px;transition:.2s}
.tot:empty{visibility:hidden}
.tot.bj{color:#122000;background:var(--l);border-color:var(--l);box-shadow:var(--glowl)}
.tot.bust{color:#fff;background:var(--r);border-color:var(--r);box-shadow:0 0 14px #ff4d6d99}
.hbet{display:flex;align-items:center;gap:5px;font:700 12px var(--mono);color:var(--y)}
.hbet .coin{width:14px;height:14px}
.hbet:empty{visibility:hidden}
/* cards */
.pc{width:var(--cw);aspect-ratio:5/7;perspective:700px;flex:none;margin-left:var(--ov);position:relative}
.pc:first-child{margin-left:0}
.pc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.pc.down .in{transform:rotateY(180deg)}
.pc .fc,.pc .bk{position:absolute;inset:0;border-radius:calc(var(--cw)*.11);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.pc .fc{background:linear-gradient(160deg,#fff 0%,#f1f2fb 70%,#e2e4f4);color:#14142a;box-shadow:0 6px 14px #0009,0 0 0 1px #0002;font-family:var(--sans)}
.pc.red .fc{color:#e81ea8}
.pc .fc .cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-weight:900;font-size:calc(var(--cw)*.26)}
.pc .fc .cn i{font-style:normal;font-size:.8em;margin-top:1px}
.pc .fc .tl{top:6%;left:7%}.pc .fc .br{bottom:6%;right:7%;transform:rotate(180deg)}
.pc .fc .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.56);line-height:1}
.pc.red .fc .pip{text-shadow:0 0 10px #ff3dc866}
.pc .fc .face{position:absolute;inset:22% 22%;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center;font:900 calc(var(--cw)*.42)/1 var(--sans);background:linear-gradient(160deg,#8b5cff22,#22f0ff22)}
.pc.red .fc .face{background:linear-gradient(160deg,#ff3dc822,#ffd84d22)}
.pc .fc .face small{display:block;font-size:.45em;text-align:center;margin-top:2px}
.pc .bk{transform:rotateY(180deg);border:2px solid #ff3dc8;box-shadow:0 6px 14px #0009,0 0 12px #ff3dc866;background:
  radial-gradient(circle at 50% 50%,#22f0ff55 0 10%,transparent 11%),
  repeating-linear-gradient(45deg,#ff3dc833 0 3px,transparent 3px 9px),repeating-linear-gradient(-45deg,#22f0ff33 0 3px,transparent 3px 9px),linear-gradient(160deg,#2a0f4a,#120624)}
.pc .bk:after{content:"";position:absolute;inset:7%;border-radius:5px;border:1px solid #22f0ff88;box-shadow:inset 0 0 10px #22f0ff44}
/* result banners */
.ban{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);z-index:5;font:900 clamp(14px,4.2vw,22px)/1 var(--sans);letter-spacing:.08em;padding:7px 12px;border-radius:10px;white-space:nowrap;animation:banin .45s cubic-bezier(.2,1.6,.4,1);pointer-events:none;background:#05050ae6;border:2px solid currentColor}
.ban.bj{color:var(--l);box-shadow:0 0 24px #b8ff3b99,inset 0 0 12px #b8ff3b55;text-shadow:0 0 10px var(--l)}
.ban.win{color:var(--c);box-shadow:0 0 20px #22f0ff88;text-shadow:0 0 10px var(--c)}
.ban.push{color:var(--y);box-shadow:0 0 16px #ffd84d66}
.ban.bust{color:var(--r);box-shadow:0 0 20px #ff4d6d99;text-shadow:0 0 8px var(--r)}
.ban.lose{color:var(--dim);border-color:var(--line2)}
@keyframes banin{from{transform:translate(-50%,-50%) rotate(-6deg) scale(.2);opacity:0}}
/* arc */
.arc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.arc svg{width:min(100%,560px);aspect-ratio:560/76;height:auto;overflow:visible}
.arc text{font:800 17px var(--sans);letter-spacing:.07em;fill:#7ff8ff;filter:drop-shadow(0 0 4px #22f0ff)}
.msg{text-align:center;font:700 12px var(--sans);letter-spacing:.06em;color:#ffffffb0;min-height:17px}
@media(min-width:900px){.msg{font-size:14px;min-height:20px}}
/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;border-top:1px solid #22f0ff22;background:#05050a99;flex:none}
@media(min-width:900px){.acts{grid-template-columns:repeat(4,1fr);padding:14px 20px;gap:12px}}
.acts .btn{min-height:52px;font-size:16px;letter-spacing:.08em;position:relative}
@media(min-width:900px){.acts .btn{min-height:58px}}
.acts .btn kbd{font:700 10px var(--mono);color:inherit;opacity:.55;border:1px solid currentColor;border-radius:5px;padding:0 4px;margin-left:2px}
@media(hover:none){.acts .btn kbd{display:none}}
.acts .btn.hint{outline:2px solid var(--y);outline-offset:2px;box-shadow:0 0 22px #ffd84daa}
.acts .btn.hint:after{content:"HINT";position:absolute;top:-8px;right:8px;font:900 9px var(--sans);letter-spacing:.1em;background:var(--y);color:#1a1400;padding:2px 5px;border-radius:5px}
/* panel */
#panel{display:flex;flex-direction:column}
.dealbox{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.rebet{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rebet[hidden]{display:none}
.rebet .btn{min-height:48px;padding:0 8px;font-size:14px}
.hintrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:4px}
.hintrow span{font-size:13px;color:var(--dim)}.hintrow b{display:block;color:var(--txt);font-size:14px}
@media(max-width:899px){.dealbox{order:0}#panel .ghead{order:1}.betctl{order:2}.panel-rest{order:3}}
@media(min-width:900px){.dealbox{order:2;margin:4px 0 12px}.betctl{order:1}.panel-rest{order:3}}
</style></head>
<body>
<main class="game">
  <section class="panel" id="panel">
    <div class="dealbox">
      <button class="btn big pri" id="deal">Deal</button>
      <div class="rebet" id="rebet" hidden><button class="btn" id="rb1">Rebet</button><button class="btn pink" id="rb2">Rebet ×2</button></div>
    </div>
    <div class="panel-rest">
      <label class="hintrow"><span><b>Strategy hint</b>Highlights the basic-strategy play</span><span class="toggle"><input type="checkbox" id="hint"><i></i></span></label>
      <div class="stat-row"><span>Hands this session</span><b id="sHands">0</b></div>
      <div class="stat-row"><span>Blackjacks</span><b id="sBj">0</b></div>
      <div class="stat-row"><span>Session net</span><b id="sNet">0</b></div>
    </div>
  </section>
  <section class="stage felt">
    <div class="recent" id="recent"></div>
    <div class="tbl" id="tbl">
      <div class="shoe" id="shoe" aria-hidden="true"><i></i><i></i><i></i><b>SHOE</b></div>
      <div class="zone" id="dzone"><span class="who">Dealer</span><div class="cards" id="dealer"></div><span class="tot mono" id="dtot"></span></div>
      <div class="arc" aria-label="Blackjack pays 3 to 2. Dealer stands on 17."><svg viewBox="0 0 560 76" aria-hidden="true">
        <defs><linearGradient id="arcg" x1="0" x2="1"><stop offset="0" stop-color="#ff3dc8"/><stop offset=".5" stop-color="#22f0ff"/><stop offset="1" stop-color="#ff3dc8"/></linearGradient></defs>
        <path id="arcp" d="M24 24 Q280 92 536 24" fill="none"/>
        <path d="M10 6 Q280 86 550 6" fill="none" stroke="url(#arcg)" stroke-width="2" opacity=".8" style="filter:drop-shadow(0 0 5px #ff3dc8)"/>
        <path d="M46 42 Q280 100 514 42" fill="none" stroke="#22f0ff" stroke-width="1" opacity=".35"/>
        <text text-anchor="middle"><textPath href="#arcp" startOffset="50%">BLACKJACK PAYS 3 TO 2 · DEALER STANDS ON 17</textPath></text>
      </svg><div class="msg" id="msg" aria-live="polite"></div></div>
      <div class="zone" id="pzone"><div class="hands" id="hands"></div><span class="who">Player</span></div>
    </div>
    <div class="acts" id="acts">
      <button class="btn pri" data-a="H" disabled>HIT <kbd>H</kbd></button>
      <button class="btn pink" data-a="S" disabled>STAND <kbd>S</kbd></button>
      <button class="btn lime" data-a="D" disabled>DOUBLE <kbd>D</kbd></button>
      <button class="btn" data-a="P" disabled>SPLIT <kbd>P</kbd></button>
    </div>
  </section>
</main>
<script type="module" src="/games/blackjack.js"></script>
</body></html>
