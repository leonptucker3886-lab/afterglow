<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rewards · AFTERGLOW social casino</title>
<meta name="description" content="Free Glow Coins on AFTERGLOW: daily wheel with streak bonus, Orbit Drop every 3 hours, refuels, level rewards and achievements.">
<meta name="theme-color" content="#05050a"><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/core/ag.css">
<style>
.rw{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:16px}
@media(min-width:900px){.rw{grid-template-columns:1.1fr 1fr;align-items:start}}
.wheelbox{text-align:center;position:relative}
.wheelwrap{position:relative;width:min(100%,340px);margin:10px auto 6px;aspect-ratio:1}
.wheelwrap svg.wheel{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.8,.12,1);filter:drop-shadow(0 0 22px #ff3dc855)}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:34px;height:42px;z-index:2;filter:drop-shadow(0 0 8px #fff)}
.hub{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,#1c1c36,#0b0b18);border:2px solid var(--c);box-shadow:var(--glow);display:grid;place-items:center;font:900 13px var(--sans);letter-spacing:.08em}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.streak div{border-radius:10px;border:1px solid var(--line2);padding:6px 0;font:700 11px var(--mono);color:var(--faint);text-align:center}
.streak div b{display:block;font-size:13px;color:var(--dim)}
.streak div.on{border-color:var(--p);color:var(--p);box-shadow:0 0 12px #ff3dc844}.streak div.on b{color:#fff}
.streak div.next{border-style:dashed;border-color:var(--c)}
.mini{display:flex;align-items:center;gap:14px}
.mini .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.mini h3{font-size:16px}.mini small{color:var(--dim)}
.mini .btn{margin-left:auto;flex:none}
.ladder{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.ladder::-webkit-scrollbar{display:none}
.ladder div{flex:none;min-width:96px;border-radius:12px;border:1px solid var(--line2);padding:10px;text-align:center}
.ladder div b{display:block;font-size:14px}.ladder div small{color:var(--faint);font:700 11px var(--mono)}
.ladder div.on{background:var(--panel2)}
.achs{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.achs{grid-template-columns:1fr 1fr}}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.ach .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel3);font-size:18px;filter:grayscale(1);opacity:.5}
.ach.got{border-color:#ffd84d55}.ach.got .ic{filter:none;opacity:1;background:#ffd84d22;box-shadow:0 0 12px #ffd84d44}
.ach b{display:block;font-size:14px}.ach small{color:var(--faint);font-size:12px}
.ach .rw2{margin-left:auto;font:800 12px var(--mono);color:var(--l);white-space:nowrap}
</style></head>
<body>
<main class="wrap">
  <div class="h-sec" style="margin-top:18px"><h2>Free <em>Glow</em></h2><span class="faint" style="font-size:13px">No store. No catch.</span></div>
  <div class="rw">
    <section class="card wheelbox" id="wheel">
      <span class="pill p">Daily Glow Wheel</span>
      <div class="wheelwrap">
        <svg class="pointer" viewBox="0 0 34 42"><path d="M17 42L2 6a15 15 0 0 1 30 0z" fill="#fff"/><circle cx="17" cy="12" r="5" fill="#ff3dc8"/></svg>
        <svg class="wheel" id="wsvg" viewBox="-160 -160 320 320"></svg>
        <div class="hub">GLOW</div>
      </div>
      <div class="streak" id="streak"></div>
      <p class="dim" id="wtxt" style="margin:6px 0 12px;font-size:14px"></p>
      <button class="btn big pink" id="spin">Spin</button>
    </section>
    <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:14px">
      <section class="card mini"><div class="ic" style="background:#22f0ff1a">🛰️</div><div><h3>Orbit Drop</h3><small id="dtxt"></small></div><button class="btn pri" id="drop">Collect</button></section>
      <section class="card mini"><div class="ic" style="background:#b8ff3b14">⛽</div><div><h3>Refuel</h3><small id="ftxt"></small></div><button class="btn lime" id="fuel">Refuel</button></section>
      <section class="card"><div class="mini" style="margin-bottom:12px"><div class="ic" style="background:#8b5cff22">⚡</div><div><h3 id="lt">Level</h3><small id="ls"></small></div></div>
        <div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden"><i id="lbar" style="display:block;height:100%;width:0;transition:width .6s"></i></div>
        <div class="lab" style="margin:16px 0 8px">Tiers</div><div class="ladder" id="ladder"></div></section>
    </div>
  </div>
  <div class="h-sec" id="achievements"><h2>Achie<em>vements</em></h2><span class="faint mono" id="acount" style="font-size:13px"></span></div>
  <div class="achs" id="achs"></div>
</main>
<script type="module">
import { boot, state, on, ACH, TIERS, tierOf, xpFor, levelReward, fmt, fmtFull, sfx, buzz, burst, confetti, toast, $, esc } from '/core/ag.js';
import * as B from '/core/bonus.js';
boot({ nav: 'rewards' });

const COLS = ['#22f0ff', '#ff3dc8', '#8b5cff', '#b8ff3b', '#ffd84d', '#ff3dc8', '#22f0ff', '#8b5cff'];
const n = B.WHEEL.length, seg = 360 / n;
$('#wsvg').innerHTML = B.WHEEL.map((v, i) => {
  const a0 = (i * seg - 90 - seg / 2) * Math.PI / 180, a1 = ((i + 1) * seg - 90 - seg / 2) * Math.PI / 180, R = 150;
  const mid = (i * seg - 90) * Math.PI / 180;
  return `<path d="M0 0L${R * Math.cos(a0)} ${R * Math.sin(a0)}A${R} ${R} 0 0 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)}Z" fill="${i % 2 ? '#0e0e1c' : '#15152a'}" stroke="${COLS[i]}" stroke-opacity=".5"/>
  <text transform="translate(${100 * Math.cos(mid)} ${100 * Math.sin(mid)}) rotate(${i * seg})" text-anchor="middle" dominant-baseline="middle" fill="${COLS[i]}" font-family="ui-monospace,monospace" font-weight="900" font-size="${v >= 10000 ? 24 : 20}" style="filter:drop-shadow(0 0 4px ${COLS[i]})">${fmt(v)}</text>`;
}).join('') + `<circle r="152" fill="none" stroke="url(#wr)" stroke-width="6"/><defs><linearGradient id="wr"><stop offset="0" stop-color="#22f0ff"/><stop offset="1" stop-color="#ff3dc8"/></linearGradient></defs>` +
  Array.from({ length: n }, (_, i) => { const a = (i * seg - 90 + seg / 2) * Math.PI / 180; return `<circle cx="${152 * Math.cos(a)}" cy="${152 * Math.sin(a)}" r="4" fill="#fff"/>`; }).join('');

let rot = 0, spinning = false;
function paintWheel() {
  const ready = B.dailyReady(), s = ready ? B.nextStreak() : state.daily.streak;
  $('#streak').innerHTML = Array.from({ length: 7 }, (_, i) => `<div class="${i < (ready ? s - 1 : s) ? 'on' : ''} ${ready && i === Math.min(s, 7) - 1 ? 'next' : ''}">D${i + 1}<b>${B.streakMult(i + 1)}×</b></div>`).join('');
  $('#wtxt').innerHTML = ready ? `Day <b>${s}</b> streak bonus: every prize ×<b>${B.streakMult(s)}</b>. Come back tomorrow to keep it going.` : `Claimed today. Next spin in <b class="mono">${B.clock(B.msToMidnight())}</b>.`;
  $('#spin').disabled = !ready || spinning; $('#spin').textContent = ready ? 'Spin the wheel' : 'Come back tomorrow';
}
$('#spin').onclick = async () => {
  if (spinning) return;
  const r = B.spinDaily(); if (!r) return;
  spinning = true; paintWheel(); sfx('bet');
  const target = 360 * 6 + (360 - r.index * seg) + (Math.random() - 0.5) * seg * 0.6;
  rot = rot - (rot % 360) + target;
  const w = $('#wsvg'); w.style.transform = `rotate(${rot}deg)`;
  const dur = state.settings.reduced ? 50 : 5000;
  if (state.settings.reduced) w.style.transition = 'none';
  let ticks = 0; const tk = setInterval(() => { if (++ticks > 40) return clearInterval(tk); sfx('tick'); }, 120);
  setTimeout(() => {
    clearInterval(tk); r.pay(); spinning = false; buzz([30, 30, 60]); confetti(); sfx('big');
    toast(`🎡 Daily wheel · <b>+${fmtFull(r.amount)} Glow</b>${r.mult > 1 ? ` (${fmtFull(r.base)} × ${r.mult} streak)` : ''}`, 'l', 5000);
    paintWheel();
  }, dur + 100);
};

function paintSide() {
  $('#dtxt').textContent = B.dropReady() ? `${fmtFull(B.dropAmount())} Glow ready (grows with your level)` : `Next drop in ${B.clock(B.dropIn())} · ${fmtFull(B.dropAmount())} Glow`;
  $('#drop').disabled = !B.dropReady();
  const f = B.refuelReady();
  $('#ftxt').textContent = state.coins >= B.REFUEL_UNDER ? `Available when you're under ${fmtFull(B.REFUEL_UNDER)} Glow` : f ? `${fmtFull(B.REFUEL_AMT)} Glow, ready now` : `Next refuel in ${B.clock(B.refuelIn())}`;
  $('#fuel').disabled = !f;
  const t = tierOf(state.level), k = state.xp / xpFor(state.level);
  $('#lt').innerHTML = `Level ${state.level} <span style="color:${t[2]};font-size:13px">· ${t[1]}</span>`;
  $('#ls').textContent = `${fmtFull(state.xp)} / ${fmtFull(xpFor(state.level))} XP · next reward +${fmtFull(levelReward(state.level + 1))}`;
  Object.assign($('#lbar').style, { width: (k * 100).toFixed(1) + '%', background: t[2], boxShadow: `0 0 12px ${t[2]}` });
  $('#ladder').innerHTML = TIERS.map(x => `<div class="${state.level >= x[0] ? 'on' : ''}" style="${state.level >= x[0] ? `border-color:${x[2]};box-shadow:0 0 12px ${x[2]}44` : ''}"><b style="color:${state.level >= x[0] ? x[2] : 'var(--faint)'}">${x[1]}</b><small>LVL ${x[0]}</small></div>`).join('');
}
const claimFx = (btn, n, label) => { if (!n) return; sfx('cash'); const r = btn.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, { count: 40 }); toast(`${label} · <b>+${fmtFull(n)} Glow</b>`, 'l'); paintSide(); };
$('#drop').onclick = e => claimFx(e.currentTarget, B.claimDrop(), '🛰️ Orbit Drop');
$('#fuel').onclick = e => claimFx(e.currentTarget, B.claimRefuel(), '⛽ Refuel');

const AI = { first: '✨', win1: '💡', x10: '🔆', x100: '💥', x1000: '🕳️', all: '🗺️', r100: '🦉', r1000: '🌃', w1m: '💎', streak7: '📅', lvl5: '🔹', lvl10: '🟢', lvl25: '🟣', lvl50: '🌟', bj: '🃏', mines: '💠', liftoff: '🚀', fs: '🌀', rlt: '🎯', plinko: '⭐' };
function paintAch() {
  const ids = Object.keys(ACH), got = ids.filter(i => state.ach[i]).length;
  $('#acount').textContent = `${got} / ${ids.length}`;
  $('#achs').innerHTML = ids.sort((a, b) => !!state.ach[b] - !!state.ach[a]).map(i => `<div class="ach ${state.ach[i] ? 'got' : ''}"><div class="ic">${AI[i] || '🏆'}</div><div><b>${esc(ACH[i][0])}</b><small>${esc(ACH[i][1])}</small></div>${ACH[i][2] ? `<span class="rw2">${state.ach[i] ? '✓ ' : '+'}${fmt(ACH[i][2])}</span>` : ''}</div>`).join('');
}
paintWheel(); paintSide(); paintAch();
setInterval(() => { paintSide(); if (!spinning) paintWheel(); }, 1000);
on('achievement', paintAch);
if (location.hash === '#wheel') setTimeout(() => $('#wheel').scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
</script>
</body></html>
